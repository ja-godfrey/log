name: Validate site

on:
  pull_request:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Verify publication policy
        run: npm run check:publication
      - name: Build site
        run: npm run build
      - name: Verify generated site
        run: npm run check:site-output
